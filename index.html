<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/icons/WorkSphere.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkSphere</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        const theme = saved || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.error('Failed to pre-initialize dark mode theme', e);
      }
    })();
  </script>
  <style>
    /* Prevent flash of unstyled theme content on reload */
    html {
      background-color: #f8fafc; /* light theme fallback: slate-50 */
    }
    html.dark {
      background-color: #020617; /* dark theme fallback: slate-950 */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
