<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/icons/WorkSphere.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkSphere</title>
  <script>
    (function () {
      try {
        document.documentElement.classList.remove('dark');
      } catch (e) {
        console.error('Failed to initialize light mode theme', e);
      }
    })();
  </script>
  <style>
    /* Prevent flash of unstyled theme content on reload */
    html {
      background-color: #f8fafc;
      /* light theme fallback: slate-50 */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
